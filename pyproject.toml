[project]
name = "eightweeksforlangchain"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "zzzps", email = "zzzps@example.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.4.2",
    "langchain-deepseek>=1.1.0",
    "langchain-openai>=1.6.2",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.53.0",
]

[project.scripts]
eightweeksforlangchain = "eightweeksforlangchain:main"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
